name: Flight Price Monitor

on:
  schedule:
    # UTC 时间，每 6 小时运行一次
    # 北京时间约为 02:00、08:00、14:00、20:00
    - cron: '0 */6 * * *'
  workflow_dispatch:  # 支持手动触发，方便测试

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fast-flights requests

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: flight-monitor-state-${{ github.run_id }}
          restore-keys: |
            flight-monitor-state-

      - name: Run flight monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          STATE_FILE: state.json
        run: python flight_monitor.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: flight-monitor-state-${{ github.run_id }}